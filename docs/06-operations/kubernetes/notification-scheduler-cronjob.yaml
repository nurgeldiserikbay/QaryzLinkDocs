apiVersion: batch/v1
kind: CronJob
metadata:
  name: qaryzlink-notification-scheduler
  labels:
    app.kubernetes.io/name: qaryzlink-notification-scheduler
    app.kubernetes.io/component: worker
spec:
  # Engineering default only. Staging owner must validate cadence and alerting.
  schedule: "*/5 * * * *"
  concurrencyPolicy: Forbid
  startingDeadlineSeconds: 120
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      backoffLimit: 0
      activeDeadlineSeconds: 240
      ttlSecondsAfterFinished: 86400
      template:
        metadata:
          labels:
            app.kubernetes.io/name: qaryzlink-notification-scheduler
            app.kubernetes.io/component: worker
        spec:
          automountServiceAccountToken: false
          restartPolicy: Never
          securityContext:
            runAsNonRoot: true
            seccompProfile:
              type: RuntimeDefault
          containers:
            - name: notification-scheduler
              image: registry.example.com/qaryzlink/back@sha256:REPLACE_WITH_RELEASE_DIGEST
              imagePullPolicy: IfNotPresent
              command:
                - node
                - dist/src/notification-scheduler.main.js
              envFrom:
                - configMapRef:
                    name: qaryzlink-back
                - secretRef:
                    name: qaryzlink-back
              securityContext:
                allowPrivilegeEscalation: false
                readOnlyRootFilesystem: true
                capabilities:
                  drop:
                    - ALL
              resources:
                requests:
                  cpu: 25m
                  memory: 128Mi
                limits:
                  cpu: 250m
                  memory: 256Mi
